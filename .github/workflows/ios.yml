name: iOS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ios.yml'
      # Shared engine code — triggers all platforms
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/build-scripts/**'
      - 'Tools/dora-rust/**'
      # Platform-specific code
      - 'Projects/iOS/**'
      - 'Projects/apple/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/build-scripts/**'
      - 'Tools/dora-rust/**'
      - 'Projects/iOS/**'
      - 'Projects/apple/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    if: "!contains(github.event.head_commit.message, '[skip CI]') && !contains(github.event.head_commit.message, '[skip iOS]')"
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: iOS-ccache-${{ github.sha }}
          restore-keys: iOS-ccache-
          max-size: 2G
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Source/Rust
          prefix-key: ios
      - name: Add ccache to PATH
        run: echo "$(brew --prefix)/opt/ccache/bin" >> $GITHUB_PATH
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: iOS build
        run: |
          Tools/tolua++/build.sh
          Tools/build-scripts/build_ios.sh debug
