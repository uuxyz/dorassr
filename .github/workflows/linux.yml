name: Linux

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/linux.yml'
      # Shared engine code — triggers all platforms
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/build-scripts/**'
      - 'Tools/dora-rust/**'
      # Platform-specific code
      - 'Projects/CMake/**'
      - 'Projects/Linux/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/linux.yml'
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/build-scripts/**'
      - 'Tools/dora-rust/**'
      - 'Projects/CMake/**'
      - 'Projects/Linux/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip CI]') && !contains(github.event.head_commit.message, '[skip Linux]')"
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install deps
      run: |
        shopt -s nullglob
        for chrome_source in /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources; do
          sudo mv "$chrome_source" "$chrome_source.disabled"
        done
        sudo apt-get update
        sudo apt-get install -y ccache cmake pkg-config libgl1-mesa-dev libssl-dev libdbus-1-dev \
          libasound2-dev libjack-jackd2-dev libpulse-dev libpipewire-0.3-dev libsamplerate0-dev libsndio-dev \
          libibus-1.0-dev libudev-dev libusb-1.0-0-dev \
          libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
          libdrm-dev libgbm-dev libegl1-mesa-dev libwayland-dev libwayland-bin wayland-protocols \
          libxkbcommon-dev libdecor-0-dev
    - name: Install SDL3
      run: |
        if apt-cache show libsdl3-dev >/dev/null 2>&1; then
          sudo apt-get install -y libsdl3-dev
        else
          git clone --depth 1 --branch release-3.4.14 https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL3/build -j"$(nproc)"
          sudo cmake --install /tmp/SDL3/build
        fi
    - name: Generate Lua bindings
      run: |
        sudo apt-get install lua5.1
        sudo apt-get install -y luarocks
        sudo luarocks install luafilesystem
        cd ./Tools/tolua++
        lua tolua++.lua
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'
    - uses: dtolnay/rust-toolchain@stable
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.workflow }}-ccache-${{ github.sha }}
        restore-keys: ${{ github.workflow }}-ccache-
        max-size: 2G
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: Source/Rust
        prefix-key: ${{ github.workflow }}
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: v2.9.4
    - name: Make
      run: Tools/build-scripts/build_linux.sh debug
